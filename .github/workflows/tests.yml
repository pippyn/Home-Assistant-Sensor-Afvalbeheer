name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: python3 -m pip install -r requirements_test.txt

      - name: Check critical Python errors
        run: |
          python3 -m pip install ruff
          python3 -m ruff check --select E9,F63,F7,F82 custom_components/afvalbeheer tests

      - name: Compile-check
        run: python3 -m compileall custom_components/afvalbeheer

      - name: Validate translation JSON
        run: |
          for f in custom_components/afvalbeheer/translations/*.json; do
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Run tests
        run: python3 -m pytest tests/ -v
